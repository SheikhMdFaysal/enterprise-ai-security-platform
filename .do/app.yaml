name: ai-security-platform
region: nyc

services:
  - name: backend
    github:
      repo: SheikhMdFaysal/enterprise-ai-security-platform
      branch: main
      deploy_on_push: true
    source_dir: /distribution/backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
      - path: /api/docs
      - path: /api/redoc
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db-postgresql.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: redis://localhost:6379/0
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: ALLOWED_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET

static_sites:
  - name: frontend
    github:
      repo: SheikhMdFaysal/enterprise-ai-security-platform
      branch: main
      deploy_on_push: true
    source_dir: /frontend
    build_command: npm install && npm run build
    output_dir: dist
    routes:
      - path: /

databases:
  - name: db-postgresql
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
